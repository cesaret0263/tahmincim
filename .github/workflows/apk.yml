name: APK olustur
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Projeyi hazirla
        run: |
          ls -la
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          echo "Bulunan zip: $ZIP"
          mkdir -p paket
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP" -d paket; fi
          APPJS=$(find paket . -name App.js -not -path '*/node_modules/*' | head -n 1)
          test -n "$APPJS" || { echo "Proje dosyalari bulunamadi"; exit 1; }
          SRC=$(dirname "$APPJS")
          echo "Proje klasoru: $SRC"
          npx --yes create-expo-app@latest app --template blank --yes --no-install
          cp -r "$SRC"/. app/
          cd app
          npm install
          npx expo install firebase @react-native-async-storage/async-storage react-native-safe-area-context expo-image-picker expo-image-manipulator react-native-google-mobile-ads
          npx expo prebuild -p android --clean
      - name: APK derle
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: APK'yi yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tahmincim APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/release/app-release.apk
